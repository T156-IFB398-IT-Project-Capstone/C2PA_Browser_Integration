[package]
name    = "c2pa-service"
version = "0.1.0"
edition = "2021"
authors = ["QUT IFB398 Capstone Team"]
description = "Local verification service for the C2PA browser extension (Databench capstone)."
license = "UNLICENSED"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# HTTP framework
axum        = "0.7"
tower       = "0.4"
tower-http  = { version = "0.5", features = ["cors", "limit", "trace"] }

# Serialisation
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging / tracing
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Errors
anyhow   = "1.0"
thiserror = "1.0"

# Crypto / encoding
base64 = "0.22"
rand   = "0.8"

# Config file persistence
toml = "0.8"

# ----------------------------------------------------------------------------
# TODO (Sprint 3+): uncomment when integrating real C2PA verification.
# c2pa = { version = "0.32", features = ["file_io"] }
# ----------------------------------------------------------------------------

[profile.release]
opt-level = 3
lto       = "thin"
