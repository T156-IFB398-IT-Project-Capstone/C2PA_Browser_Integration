<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>C2PA dev-test-library gallery</title>
<style>
  body { font-family: system-ui, sans-serif; background: #1c1c1e; color: #eee; margin: 0; padding: 32px; }
  h1 { font-weight: 600; }
  p.note { color: #999; max-width: 60ch; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; margin-top: 24px; }
  figure { margin: 0; background: #2a2a2d; border-radius: 10px; padding: 12px; }
  figure img, figure video { width: 100%; height: 220px; object-fit: cover; border-radius: 6px; display: block; background: #000; }
  figcaption { margin-top: 8px; font-size: 13px; line-height: 1.4; }
  figcaption .file { display: block; font-family: ui-monospace, monospace; color: #ffd479; }
  figcaption .expect { display: block; color: #9ad1ff; margin-top: 4px; }
</style>
</head>
<body>
<h1>dev-test-library gallery</h1>
<p class="note">
  Every image in <code>dev-test-library/</code>, for exercising the extension's
  scan + corner-badge pipeline. "Expect" notes are guesses based on filename/folder,
  not verified ground truth — use them as a starting point, not an oracle.
</p>

<div class="grid">

  <figure>
    <img src="NO-C2PA-cloudmountain.jpg" alt="NO-C2PA-cloudmountain.jpg">
    <figcaption>
      <span class="file">NO-C2PA-cloudmountain.jpg</span>
      <span class="expect">Expect: no_credentials → no badge</span>
    </figcaption>
  </figure>

  <figure>
    <img src="adobe-official-manifests/car.jpg" alt="car.jpg">
    <figcaption>
      <span class="file">adobe-official-manifests/car.jpg</span>
      <span class="expect">Expect: Adobe official manifest, likely trusted</span>
    </figcaption>
  </figure>

  <figure>
    <img src="adobe-official-manifests/cloudscape.jpeg" alt="cloudscape.jpeg">
    <figcaption>
      <span class="file">adobe-official-manifests/cloudscape.jpeg</span>
      <span class="expect">Expect: Adobe official manifest, likely trusted</span>
    </figcaption>
  </figure>

  <figure>
    <img src="adobe-official-manifests/crater-lake.jpg" alt="crater-lake.jpg">
    <figcaption>
      <span class="file">adobe-official-manifests/crater-lake.jpg</span>
      <span class="expect">Expect: Adobe official manifest, likely trusted</span>
    </figcaption>
  </figure>

  <figure>
    <img src="adobe-official-manifests/Firefly-cat.jpg" alt="Firefly-cat.jpg">
    <figcaption>
      <span class="file">adobe-official-manifests/Firefly-cat.jpg</span>
      <span class="expect">Expect: AI-generated (Firefly) → ai_generated badge</span>
    </figcaption>
  </figure>

  <figure>
    <img src="adobe-official-manifests/ChatGPTgen.png" alt="ChatGPTgen.png">
    <figcaption>
      <span class="file">adobe-official-manifests/ChatGPTgen.png</span>
      <span class="expect">Expect: AI-generated (ChatGPT) → ai_generated badge</span>
    </figcaption>
  </figure>

  <figure>
    <video src="adobe-official-manifests/sora.MP4" controls muted></video>
    <figcaption>
      <span class="file">adobe-official-manifests/sora.MP4</span>
      <span class="expect">Video — badge overlay is image-only right now, not wired up for &lt;video&gt;</span>
    </figcaption>
  </figure>

  <figure>
    <img src="untrusted-cert-self-signed/test_human_verified.jpg" alt="test_human_verified.jpg">
    <figcaption>
      <span class="file">untrusted-cert-self-signed/test_human_verified.jpg</span>
      <span class="expect">Expect: valid signature, untrusted signer → unverifiable badge</span>
    </figcaption>
  </figure>

  <figure>
    <img src="untrusted-cert-self-signed/test_ai_verified.jpg" alt="test_ai_verified.jpg">
    <figcaption>
      <span class="file">untrusted-cert-self-signed/test_ai_verified.jpg</span>
      <span class="expect">Expect: AI-disclosed but untrusted signer → ai_generated badge should still show (bypasses trust gate)</span>
    </figcaption>
  </figure>

  <figure>
    <img src="untrusted-cert-self-signed/tamperedpixels.jpeg" alt="tamperedpixels.jpeg">
    <figcaption>
      <span class="file">untrusted-cert-self-signed/tamperedpixels.jpeg</span>
      <span class="expect">Expect: content_tampered → unverifiable badge (unless it also discloses AI)</span>
    </figcaption>
  </figure>

</div>
</body>
</html>
