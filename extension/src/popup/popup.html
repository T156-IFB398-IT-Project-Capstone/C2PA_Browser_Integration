<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>C2PA Content Credentials</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="header">
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">⎈</div>
      <div class="brand-text">
        <div class="brand-title">C2PA Verify</div>
        <div class="brand-sub">QUT × Databench</div>
      </div>
    </div>
    <a id="btn-test-bench" class="icon-btn" href="http://127.0.0.1:8976" target="_blank"
       rel="noopener" title="Open the C2PA test bench (right-click for options)"
       aria-label="Open the C2PA test bench (right-click for options)">⧉</a>
  </header>

  <!-- Custom context menu — right-click #btn-test-bench. Default click above
       (127.0.0.1:8976) is a local dev server, not part of the shipped
       extension; this menu explains the difference and offers the public
       alternative. Positioned near the button, not at cursor coordinates —
       the popup is only 360px wide. -->
  <div id="test-bench-menu" class="context-menu hidden" role="menu" aria-label="Test bench link options">
    <div class="context-menu-item" data-key="local">
      <button class="context-menu-open" data-url="http://127.0.0.1:8976" role="menuitem">
        <div class="context-menu-title">Local dev test bench</div>
        <div class="context-menu-desc">127.0.0.1:8976 — a local dev server. Only reachable while it's actually running on this machine.</div>
      </button>
      <button class="context-menu-default" data-key="local" title="Set as the left-click default" aria-label="Set local dev test bench as the left-click default">☆</button>
    </div>
    <div class="context-menu-item" data-key="public">
      <button class="context-menu-open" data-url="https://c2patest.pages.dev" role="menuitem">
        <div class="context-menu-title">Public test bench</div>
        <div class="context-menu-desc">c2patest.pages.dev — the real hosted deployment. Works for anyone, but may not reflect local changes until someone deploys them.</div>
      </button>
      <button class="context-menu-default" data-key="public" title="Set as the left-click default" aria-label="Set public test bench as the left-click default">☆</button>
    </div>
    <div class="context-menu-hint">☆ / ★ — set which one opens on a plain click</div>
  </div>

  <!-- ===== Main view ===== -->
  <main id="view-main" class="view">

    <!-- Tab bar -->
    <div class="tab-bar" role="tablist">
      <button id="tab-scan" class="tab-btn tab-btn--active" role="tab" aria-selected="true"
              aria-controls="panel-scan">Scan Results</button>
      <button id="tab-live" class="tab-btn" role="tab" aria-selected="false"
              aria-controls="panel-live">
        Live Media
        <span id="live-count-badge" class="live-badge hidden" aria-label="detected media count">0</span>
      </button>
    </div>

    <!-- ── Scan panel (default visible) ─────────────────────────────────── -->
    <div id="panel-scan" role="tabpanel" aria-labelledby="tab-scan">
      <button id="btn-scan" class="primary-btn" disabled>Scan this page</button>

      <!-- Progress bar (visible during scan) -->
      <div id="scan-progress" class="progress-wrap hidden" aria-live="polite" aria-label="Scan progress">
        <div class="progress-track">
          <div class="progress-fill" style="width:0%"></div>
        </div>
        <span class="progress-label"></span>
      </div>

      <div id="scan-meta" class="scan-meta hidden"></div>

      <ul id="results" class="results" aria-live="polite"></ul>

      <div id="empty" class="empty hidden">
        <p>No images scanned yet on this page.</p>
        <p class="hint">Click <strong>Scan this page</strong> to detect Content Credentials.</p>
      </div>
    </div>

    <!-- ── Live media panel (hidden until tab click) ─────────────────────── -->
    <div id="panel-live" class="hidden" role="tabpanel" aria-labelledby="tab-live">
      <div id="live-meta" class="scan-meta hidden"></div>

      <ul id="live-list" class="results" aria-live="polite" aria-label="Live detected media"></ul>

      <div id="live-empty" class="empty hidden">
        <p>No media detected yet.</p>
        <p class="hint">Media will appear here as it loads on the page.</p>
      </div>
    </div>

  </main>

  <script type="module" src="popup.js"></script>
</body>
</html>
